<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="880" height="300" role="img" aria-labelledby="turn-title turn-desc">
  <title id="turn-title">Where the judgment layer acts</title>
  <desc id="turn-desc">Four Claude Code events in a turn and its compaction, each with the gate that judges it: instructions at the prompt, the tool gate at every tool call including read_coordinate, the Stop gate after your own Stop hooks when the turn ends, and fold relevance at compaction.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #2d3142; }
    .eyebrow { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 10.5px; letter-spacing: 1px; fill: #4f5d75; }
    .name { font-size: 13px; font-weight: 600; }
    .hook { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11px; fill: #4f5d75; }
    .desc { font-size: 12px; fill: #4f5d75; }
  </style>
  <defs>
    <marker id="arr-muted" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#4f5d75"/></marker>
    <marker id="arr-accent" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#eb6c36"/></marker>
  </defs>

  <rect width="880" height="300" rx="12" fill="#f5f5f5"/>

  <!-- Connectors first. -->
  <path d="M218 68 H236" fill="none" stroke="#4f5d75" stroke-width="1.3" marker-end="url(#arr-muted)"/>
  <path d="M428 68 H446" fill="none" stroke="#4f5d75" stroke-width="1.3" marker-end="url(#arr-muted)"/>
  <path d="M638 68 H656" fill="none" stroke="#4f5d75" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#arr-muted)"/>
  <path d="M125 98 V138" fill="none" stroke="#eb6c36" stroke-width="1.3" marker-end="url(#arr-accent)"/>
  <path d="M335 98 V138" fill="none" stroke="#eb6c36" stroke-width="1.3" marker-end="url(#arr-accent)"/>
  <path d="M545 98 V138" fill="none" stroke="#eb6c36" stroke-width="1.3" marker-end="url(#arr-accent)"/>
  <path d="M755 98 V138" fill="none" stroke="#eb6c36" stroke-width="1.3" marker-end="url(#arr-accent)"/>

  <text x="32" y="28" class="eyebrow">CLAUDE CODE</text>
  <text x="32" y="126" class="eyebrow">GATES</text>

  <!-- Claude Code's events. -->
  <rect x="32" y="38" width="186" height="60" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="0.8"/>
  <text x="44" y="64" class="name">You send a prompt</text>
  <text x="44" y="84" class="hook">prompt.submit</text>
  <rect x="242" y="38" width="186" height="60" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="0.8"/>
  <text x="254" y="64" class="name">A tool is called</text>
  <text x="254" y="84" class="hook">tool.call</text>
  <rect x="452" y="38" width="186" height="60" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="0.8"/>
  <text x="464" y="64" class="name">The turn ends</text>
  <text x="464" y="84" class="hook">Stop</text>
  <rect x="662" y="38" width="186" height="60" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="0.8"/>
  <text x="674" y="64" class="name">Compaction</text>
  <text x="674" y="84" class="hook">session.compact</text>

  <!-- The gates. -->
  <rect x="32" y="144" width="186" height="132" rx="6" fill="#ffffff" stroke="#eb6c36" stroke-width="0.9"/>
  <text x="44" y="170" class="name">Instructions</text>
  <text x="44" y="192" class="desc">Attaches a fragment</text>
  <text x="44" y="208" class="desc">when the prompt meets</text>
  <text x="44" y="224" class="desc">its condition, once;</text>
  <text x="44" y="240" class="desc">pinned ones sit in</text>
  <text x="44" y="256" class="desc">the system prompt.</text>

  <rect x="242" y="144" width="186" height="132" rx="6" fill="#ffffff" stroke="#eb6c36" stroke-width="0.9"/>
  <text x="254" y="170" class="name">Tool gate</text>
  <text x="254" y="192" class="desc">Refuses secret files</text>
  <text x="254" y="208" class="desc">and secret-printing</text>
  <text x="254" y="224" class="desc">commands under another</text>
  <text x="254" y="240" class="desc">provider, including</text>
  <text x="254" y="256" class="desc">read_coordinate.</text>

  <rect x="452" y="144" width="186" height="132" rx="6" fill="#ffffff" stroke="#eb6c36" stroke-width="0.9"/>
  <text x="464" y="170" class="name">Stop gate</text>
  <text x="464" y="192" class="desc">Runs after your own</text>
  <text x="464" y="208" class="desc">Stop hooks; sends the</text>
  <text x="464" y="224" class="desc">model back when the</text>
  <text x="464" y="240" class="desc">turn ends announcing</text>
  <text x="464" y="256" class="desc">work it has not done.</text>

  <rect x="662" y="144" width="186" height="132" rx="6" fill="#ffffff" stroke="#eb6c36" stroke-width="0.9"/>
  <text x="674" y="170" class="name">Fold relevance</text>
  <text x="674" y="192" class="desc">Records which large</text>
  <text x="674" y="208" class="desc">earlier results the</text>
  <text x="674" y="224" class="desc">request still needs.</text>
  <text x="674" y="240" class="desc">Shadow only, for now.</text>
</svg>
